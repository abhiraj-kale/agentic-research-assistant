name: Keep backend awake

# Pings the backend's /health endpoint on a schedule so Render's free-tier
# instance does not spin down (it sleeps after ~15 min of inactivity). This
# matters most during Chrome Web Store review, when a cold start could make
# the extension's requests time out.
#
# Notes:
# - GitHub-scheduled runs are best-effort and can be delayed a few minutes,
#   so we ping every 10 min to stay comfortably under the 15-min sleep window.
# - Scheduled workflows are auto-disabled after 60 days of no repo activity.
# - You can also run it manually from the Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (waking the instance if asleep)
        run: |
          curl -fsS \
            --max-time 120 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 15 \
            https://agentic-research-assistant-yoh8.onrender.com/health
